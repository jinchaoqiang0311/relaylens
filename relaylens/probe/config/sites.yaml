# RelayLens 在册站点配置(v0.2 · 首批真实站点)
# 健康检查均用公开/免key端点;价格采集见 src/parsers/
# enabled: false 的站点会被所有任务跳过

sites:
  # ---------- 真实中转站(new-api 系,首批 2 家) ----------
  - name: "aixoras"
    base_url: "https://aixoras.com"           # /v1/models 带 key 200;/api/pricing 公开
    enabled: true
    tags: ["relay", "new-api"]
    parser: "newapi"
    key_env: "AIXORAS_API_KEY"
    directions: ["text", "image"]             # 声明-检测-验证:生图分组存在,故含 image;待站方认领后确认
    declared_groups:                          # 回填自价格快照(2026-09-30),待站方认领后确认;声明决定检测矩阵
        - { name: "特价Claude", models: ["claude-opus-4-6", "claude-opus-5", "claude-opus-5-5", "claude-sonnet-4-6", "claude-sonnet-5", "claude-opus-4-7-thinking", "claude-opus-4-7", "claude-opus-4-8"], tier: special, billing: "unknown" }
        - { name: "Codex", models: ["gpt-5.5", "gpt-5.6-terra", "gpt-5.6-sol", "gpt-6-astra"], tier: primary, billing: "unknown" }
        - { name: "Claude-Max-外接", models: ["claude-opus-4-6-max", "claude-opus-4-7-max", "claude-sonnet-5-5"], tier: primary, billing: "unknown" }
        - { name: "GLM智谱", models: ["glm-5.3", "glm-5.3-flash", "glm-5.2"], tier: primary, billing: "unknown" }
        - { name: "Gemini 优质", models: ["gemini-3.1-pro", "gemini-3.1-pro-preview"], tier: primary, billing: "unknown" }
        - { name: "Gemini 生图", models: ["gemini-3.1-flash-image", "gemini-3.1-flash-image-preview"], tier: primary, billing: "unknown" }
        - { name: "Deepseek", models: ["deepseek-v4-flash", "deepseek-v4-pro", "deepseek-v4.1-flash"], tier: primary, billing: "unknown" }
        - { name: "GPT 优质", models: ["gpt-5.6-luna"], tier: primary, billing: "unknown" }
        - { name: "Grok", models: ["grok-4.5", "grok-4.6", "grok-4.7"], tier: primary, billing: "unknown" }
    commerce:                                 # 商业信息无法探测,只能声明/人工核实;source 标明这条信息从哪来
      pay_methods: ["微信", "支付宝"]
      min_top_up: "¥5"
      recharge_ratio: "¥1 = 1 美元额度"        # 公示价的记账单位是美元额度
      ratio_cny_per_usd: 1                     # 数值口径:到手价 = 标价(美元数字) × 本值
      source: "manual"                         # manual=运营方人工核实(未经站方书面确认),declared=站方入驻声明
      verified: "2026-10-02"
    notes: "真实中转站;/api/pricing 公开,含分组倍率"

  - name: "aicost"
    base_url: "https://www.aicost.me"         # /v1/models 带 key 200;定价需登录,走手动导出
    enabled: true
    tags: ["relay", "new-api"]
    parser: "aicost"                          # 手动导入模式:store/manual-imports/aicost-pricing-*.json
    key_env: "AICOST_API_KEY"
    directions: ["text"]                      # 声明-检测-验证:回填自价格快照,待站方认领后确认
    declared_groups:
        - { name: "claude-kiro渠道", models: ["claude-opus-5", "claude-opus-4-6", "claude-opus-4-7", "claude-opus-4-8", "claude-sonnet-4-6", "claude-sonnet-4-5-20250929", "claude-fable-5", "claude-opus-5-5", "claude-opus-4-5-20251101"], tier: primary, billing: "unknown" }
        - { name: "gpt-plus号池", models: ["gpt-5.5", "gpt-5.6-sol", "gpt-5.6-terra", "gpt-6-astra"], tier: primary, billing: "unknown" }
        - { name: "正价kiro/满血", models: ["claude-opus-5.5"], tier: primary, billing: "unknown" }
        - { name: "cursor-claude", models: ["claude-fable-5-1"], tier: primary, billing: "unknown" }
        - { name: "gemini-语言模型", models: ["gemini-3.1-pro-preview", "gemini-3.1-flash-lite"], tier: primary, billing: "unknown" }
        - { name: "depsek", models: ["deepseek-v4.1-flash", "deepseek-v4.1-flash-hc"], tier: primary, billing: "unknown" }
        - { name: "grok语言", models: ["grok-4.5", "grok-4.6", "grok-4.7"], tier: primary, billing: "unknown" }
        - { name: "gpt-pro号池", models: ["gpt-6-sol"], tier: primary, billing: "unknown" }
    commerce:
      pay_methods: ["卡密"]                    # 无品牌 logo 的支付方式,前端降级为文字芯片
      min_top_up: "¥2"
      recharge_ratio: "¥1 = 1 美元额度"
      ratio_cny_per_usd: 1
      source: "manual"
      verified: "2026-10-02"
    notes: "真实中转站;定价页 requireAuth,数据来自浏览器 Console 手动导出"

  # ---------- 官方/聚合平台(参照系) ----------
  - name: "openrouter"
    base_url: "https://openrouter.ai/api/v1"   # /models 免鉴权 200,定价内嵌于响应
    enabled: true
    tags: ["overseas", "aggregator"]
