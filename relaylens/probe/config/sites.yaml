# 标准测试模型组合(P2 付费对账时启用)
models:
  flagship: ["claude-opus-5", "gpt-5.6-sol"]
  standard: ["claude-sonnet-5", "gpt-5.5", "deepseek-v4"]
  budget:   ["gemini-3.1-flash", "glm-5.2"]

# 任务节拍(与 method.html 宣称一致)
# 2026-10-02:健康检查从每 5 分钟降为每 5 小时(用户决定,降低运行开销)。
# 连带口径:①宕机最长 5 小时后才被发现,「24H 可用率」柱已改为「近 72 小时 · 每 6 小时一格」;
# ②新站攒够 ≥12 次样本从"1 小时内"变成"约 3 天",入榜速度变慢 —— 这是采样密度的直接代价,不是 bug。
schedules:
  health: "0 */5 * * *"
  price: "0 */6 * * *"
  # billing 自动对账(2026-10-15 用户授权接通,P2):每轮从有 key 的站轮转 2 站,真实扣费分/厘级;
  # 轮后自动刷新 ops 看板并推企微摘要。删掉本行即停用自动对账(回退 CLI 手动模式)。
  billing: "30 */12 * * *"
  # perf 双窗口(2026-10-10.1 口径):忙时/闲时各一轮,PF 取两桶较差值;有余额的站才产生费用(厘级/天)
  perf_work: "30 10 * * 1-5"
  perf_off:  "30 22 * * *"
  # fingerprint 模型指纹验真(2026-10-22 纳入调度,替代纯手动):跨站差分基线查掉包/降级,仅对有 key 的站;成本中(8+4 题 x 2 站)
  fingerprint: "0 9 * * 1"
  # tokens 注入开销检测(2026-10-22 纳入调度,替代纯手动):3 段已知文本拟合注入脚手架;成本极低,仅对有 key 的站
  tokens: "0 8 * * 4"

# 评分权重(与 web/method.html 同源)
score_weights:
  all:
    billing_honesty: 0.30
    stability: 0.25
    model_integrity: 0.25
    price: 0.20

thresholds:
  dev_warn: 1
  dev_black: 3
  price_surge_week: 15
  fp_pass: 85
  fp_suspect: 70
  min_batches: 12
