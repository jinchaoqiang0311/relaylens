# ============================================================
# RelayLens 生产 nginx 片段 —— 粘贴到站点 server 块内
# (宝塔:网站设置 → 配置文件;LNMP:对应 vhost 的 server 块)
#
# 前置:
#   1. 把 dist-relay/ 内容(除 DEPLOY.md / robots-snippet.txt)上传到站根 relay/ 子目录,例如
#        /www/wwwroot/aipaihangbang/relay/
#      (与 index.php / wp-content 同级,不是 wp-content 里)
#   2. 同机长驻模型比价看板:
#        cd 看板仓库 && $env:RELAY_HOME_URL='https://aipaihangbang.cn/relay/index.html'
#                     $env:RELAY_SELF_URL='/relay/price/'   # 若看板导航要同源
#        python relay_scraper.py serve --port 8899
#      ⚠ 只启一个 serve,排查先查 pythonw 隐藏进程(双绑 8899 会让改动不生效)
# ============================================================

# —— 1) 模型比价看板 + 数据接口:反代同机 8899 ——
#    必须放在 /relay/ 静态块之前;^~ 优先级高于普通前缀,确保 /relay/price/ 不被当静态文件 404。
#    proxy_pass 末尾的 / 会把 /relay/price/xxx 映射到看板根 /xxx(与本地 preview-server 行为一致)。
location ^~ /relay/price/ {
    proxy_pass http://127.0.0.1:8899/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /relay/api/ {
    proxy_pass http://127.0.0.1:8899/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# —— 2) 静态站(WordPress 站点根 relay/ 子目录) ——
#    root 指向站根,请求 /relay/x → /www/wwwroot/aipaihangbang/relay/x
location ^~ /relay/ {
    root /www/wwwroot/aipaihangbang;          # ⚠ 改成你的站点根目录
    index index.html;
    try_files $uri $uri/ =404;
    # HTML 不缓存(防旧页),静态资源长缓存
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css|svg|png|woff2|xml|json|ico)$ { expires 7d; add_header Cache-Control "public"; }
    # 404 兜底指向站内 404 页(保住回流量入口)
    error_page 404 /relay/404.html;
}

# —— 3) 旧路径 301(price/compare 已下线,保住外链权重) ——
location = /relay/price.html   { return 301 /relay/price/; }
location = /relay/compare.html { return 301 /relay/price/; }
location = /relay/compare      { return 301 /relay/price/; }
